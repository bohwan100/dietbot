services:
  - type: web
    name: dietbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
