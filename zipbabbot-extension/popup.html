<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    .header h1 {
      font-size: 15px;
      margin: 0;
      color: #38bdf8;
      font-weight: 800;
    }
    .status-card {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #a7f3d0;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }
    .footer {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🤖</span>
    <div>
      <h1>집밥봇 장바구니 도우미</h1>
      <div style="font-size: 11px; color: #94a3b8;">PC 원클릭 자동 담기 지원</div>
    </div>
  </div>

  <div class="status-card">
    🟢 <strong>확장 프로그램 활성화됨</strong><br>
    집밥봇 대시보드에서 <strong>[한 번에 담기]</strong>를 누르시면 쿠팡에 자동으로 쏙 담깁니다!
  </div>

  <button class="btn btn-primary" id="btn-open-dashboard">🌐 집밥봇 대시보드 열기</button>
  <button class="btn btn-secondary" id="btn-open-cart">🛍️ 내 쿠팡 장바구니 확인</button>

  <div class="footer">
    Chrome & Naver Whale 공용 · Windows / Mac 지원
  </div>

  <script src="popup.js"></script>
</body>
</html>
